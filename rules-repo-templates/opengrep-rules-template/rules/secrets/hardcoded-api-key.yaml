rules:
  - id: hardcoded-api-key
    languages: [scala, javascript, typescript]
    severity: ERROR
    message: >
      Hardcoded API key or secret detected. Move to env var or BookingsConfig.
      Hardcoded secrets in repos leak via commits, screenshots, and indexing.
    metadata:
      category: secrets
      owner: platform
      origin-bugs: []                            # populated by synthesizer
    pattern-either:
      - pattern: $VAR = "sk_live_..."
      - pattern: $VAR = "sk_test_..."
      - pattern: $VAR = "pk_live_..."
      - pattern: |
          val $KEY = "$REDACTED..."
      - patterns:
          - pattern: $VAR = "$VALUE"
          - metavariable-regex:
              metavariable: $VAR
              regex: '(?i).*(api[_-]?key|secret|token|password).*'
          - metavariable-regex:
              metavariable: $VALUE
              regex: '^[A-Za-z0-9_\-]{24,}$'
    pattern-not: $VAR = sys.env(...)
    pattern-not: $VAR = ConfigFactory.load().getString(...)
    pattern-not: $VAR = process.env.$X
