name: Scanner regression tests

# Runs the unit-test suite for scripts/scan_repo.py specialized emulators on
# every push and PR. Tests live at scripts/test_scan_repo_paths.py and cover
# the lessons from iter-17 through iter-20:
#  - relative-path matching (iter-20)
#  - Clock/storage-ts/getOrElse exclusions in CalendarNowWithoutExplicitTimezone
#    (iter 19)
#  - adapter-receiver removal in StaffQueryMissingAppDefId (iter 20)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# One in-flight run per branch; a force-push cancels the superseded run instead of
# leaving two runs racing over the same corpora.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # The interpreter this job exists to exercise. Asserted below, never assumed.
  PYTHON_VERSION: '3.12'

jobs:
  regression:
    name: Scan emulator regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # This step used to re-implement `python -m venv`, `pip install semgrep` and
      # the two script invocations inline. That second copy was wrong twice -- once
      # when `.venv` was a directory target Make skipped whenever the path already
      # existed, and once when `uv sync` turned out to build venvs with no pip --
      # and both times only the Makefile was fixed. `make test` is the single
      # definition of this suite: it builds the venv, installs the pinned semgrep,
      # then runs precision_check.py, test_scan_repo_paths.py and pytest.
      - name: Regression suite + precision corpora
        run: make test

      # The pin above is the entire reason this job is separate from the CI matrix,
      # so check it rather than trust it. The Makefile picks its interpreter by
      # probing PATH for python3.13, 3.12, 3.11 in that order, which means the
      # version actually under test is decided by the runner image unless something
      # asserts otherwise.
      - name: Assert the suite ran on the pinned interpreter
        run: |
          set -euo pipefail
          actual=$(.venv/bin/python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          if [ "$actual" != "$PYTHON_VERSION" ]; then
            echo "::error::.venv runs Python $actual but this job pins $PYTHON_VERSION"
            exit 1
          fi
          echo "suite ran on Python $actual"
