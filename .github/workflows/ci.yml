name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# One in-flight run per branch. A force-push used to leave the superseded run
# racing the new one for the same `CI` context, so the ruleset could see a stale
# result. Release is deliberately excluded -- cancelling a half-done release is
# worse than paying for a duplicate run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      # `make lint` pins ruff to the exact version in pyproject.toml, so CI runs
      # the same command and the same linter a contributor runs locally.
      - run: make lint

  # pyproject declares requires-python = ">=3.11" but CI only ever ran 3.12, so the
  # floor and the ceiling were both untested. fail-fast is off so one bad version
  # reports as one red leg instead of hiding the others.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # PYTHON is passed explicitly. Without it the Makefile probes PATH for
      # python3.13, python3.12, python3.11 in that order, and ubuntu-latest ships
      # /usr/bin/python3.12 -- so the 3.11 leg built a 3.12 venv and reported green
      # for a version it never ran. setup-python's `python` shim is this leg's
      # interpreter by construction.
      - run: make test PYTHON="$(command -v python)"
      # The matrix is only a real matrix if each leg actually runs its own
      # version. `make test` picks its interpreter by probing PATH for python3.13,
      # 3.12, 3.11 in that order, so without this the leg's verdict is decided by
      # what the runner image ships rather than by what the leg pins.
      - name: Assert this leg ran on its own interpreter
        run: |
          set -euo pipefail
          actual=$(.venv/bin/python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          if [ "$actual" != "${{ matrix.python-version }}" ]; then
            echo "::error::.venv runs Python $actual but this leg pins ${{ matrix.python-version }}"
            exit 1
          fi
          echo "leg ran on Python $actual"

  agent-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate agent instruction files
        run: make agent:check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Grep for high-signal secrets
        run: |
          set -euo pipefail
          ! rg -n 'AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{20,}|sk-[a-zA-Z0-9]{20,}' \
            --glob '!out/**' --glob '!.venv/**' --glob '!node_modules/**' || \
            (echo "Potential secret found" && exit 1)

  # Aggregate gate. The branch ruleset requires exactly one context -- `CI` --
  # and this job is it. Keep `needs` in sync with the jobs above; the ruleset
  # never needs to change again.
  CI:
    if: always()
    needs: [lint, test, agent-check, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "upstream results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job finished with '$r'"
              exit 1
            fi
          done
          echo "All required jobs succeeded."
