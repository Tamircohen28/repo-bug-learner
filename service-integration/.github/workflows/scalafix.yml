name: scalafix
on:
  pull_request:
    branches: [main, master]

# Concurrency: cancel in-flight runs on the same PR when a new push comes in
concurrency:
  group: scalafix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scalafix:
    name: Scalafix (custom Bookings rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0                          # required for --diff-base

      # olafurpg/setup-scala (Jabba, adopt@1.11) has been unmaintained since 2023;
      # use the same setup-java + setup-sbt pair as scalafix-full-scan.yml.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      # Run Scalafix only on lines changed in this PR. New violations fail the build.
      # Pre-existing violations are reported but don't block.
      - name: Run Scalafix on PR diff
        run: |
          sbt -v "; scalafixAll --check --diff-base=origin/${{ github.base_ref }}"

      # Surface findings in the PR check summary
      - name: Annotate findings
        if: failure()
        run: |
          echo "::error::Scalafix found new rule violations. See logs above and consult"
          echo "::error::your rules repository README for rule details."
