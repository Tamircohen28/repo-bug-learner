name: scalafix
on:
  pull_request:
    branches: [main, master]

# Concurrency: cancel in-flight runs on the same PR when a new push comes in
concurrency:
  group: scalafix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scalafix:
    name: Scalafix (custom Bookings rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0                          # required for --diff-base

      - uses: olafurpg/setup-scala@32ffa16635ff8f19cc21ea253a987f0fdf29844c # v14
        with:
          java-version: 'adopt@1.11'

      - uses: coursier/cache-action@4e2615869d13561d626ed48655e1a39e5b192b3c # v6.4.9

      # Run Scalafix only on lines changed in this PR. New violations fail the build.
      # Pre-existing violations are reported but don't block.
      - name: Run Scalafix on PR diff
        run: |
          sbt -v "; scalafixAll --check --diff-base=origin/${{ github.base_ref }}"

      # Surface findings in the PR check summary
      - name: Annotate findings
        if: failure()
        run: |
          echo "::error::Scalafix found new rule violations. See logs above and consult"
          echo "::error::your rules repository README for rule details."
