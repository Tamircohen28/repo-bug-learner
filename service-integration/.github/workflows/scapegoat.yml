name: scapegoat
on:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"                           # Weekly full scan, Monday morning

concurrency:
  group: scapegoat-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scapegoat:
    # Scapegoat is informational. New findings get commented on the PR but
    # don't block merge. (Custom Scalafix rules from bug-learner are the gate.)
    name: Scapegoat (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # olafurpg/setup-scala (Jabba, adopt@1.11) has been unmaintained since 2023;
      # use the same setup-java + setup-sbt pair as scalafix-full-scan.yml.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - uses: coursier/cache-action@ee0650f98295f27a505e4bfd284c9bfaa913a465 # v9.0.1

      - name: Run Scapegoat
        run: |
          sbt scapegoat

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scapegoat-report
          path: target/scala-*/scapegoat-report/
          if-no-files-found: ignore

      - name: Comment new findings on PR
        if: github.event_name == 'pull_request'
        run: |
          # TODO: Parse scapegoat-report/scapegoat.xml, diff against the base
          # branch's report, post a PR comment with the delta.
          # Until then, the artifact is downloadable from the action run.
          echo "Scapegoat report available as an action artifact."
