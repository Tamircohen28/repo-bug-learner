name: opengrep
on:
  pull_request:
    branches: [main, master]

concurrency:
  group: opengrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write                          # SARIF upload

jobs:
  opengrep:
    name: Opengrep (custom rules)
    runs-on: ubuntu-latest
    env:
      OPENGREP_VERSION: v1.30.0
      OPENGREP_SHA256: 35779bdd72e92129c8df2a77f0c55e8c08356801ea92591ef32108d6b28d564c
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # This job used to run in `container: opengrep/opengrep:latest`. No such
      # image exists on any registry -- Docker Hub answers 404 "object not
      # found", GHCR answers 404, and none of the upstream repo's workflows
      # publish one -- so the job could never have started. And a `latest` tag on
      # a job holding `security-events: write` would have let a third party
      # choose what runs next to the token anyway. Opengrep ships release
      # binaries, so pin one: an exact tag for provenance, plus a checksum so the
      # tag alone cannot decide what executes. A moved or replaced asset fails
      # `sha256sum --check` here rather than silently running something else.
      - name: Install Opengrep
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$HOME/.local/bin/opengrep" \
            "https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}/opengrep_manylinux_x86"
          echo "${OPENGREP_SHA256}  $HOME/.local/bin/opengrep" | sha256sum --check --strict -
          chmod +x "$HOME/.local/bin/opengrep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # A version written into a workflow is a claim about what will run, not a
      # test that it did. Ask the binary. Without this the job would still be
      # green if the download landed somewhere else on PATH, or if the asset
      # under this tag were ever rebuilt from other sources.
      - name: Assert this job runs the Opengrep it pinned
        run: |
          set -euo pipefail
          command -v opengrep
          actual="$(opengrep --version)"
          if [ "$actual" != "${OPENGREP_VERSION#v}" ]; then
            echo "::error::opengrep on PATH reports $actual but this job pins ${OPENGREP_VERSION}"
            exit 1
          fi
          echo "running Opengrep $actual"

      # Pull the rules repo. The rules repo's auto-generated PRs from
      # repo-bug-learner deploy here on merge.
      - name: Checkout rules repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ vars.RULES_REPO }}
          path: analysis-rules
          token: ${{ secrets.RULES_REPO_TOKEN }}
          ref: main

      - name: Run Opengrep (diff-aware)
        run: |
          opengrep scan \
            --config=./analysis-rules/rules/ \
            --baseline-ref=origin/${{ github.base_ref }} \
            --sarif --output=opengrep.sarif \
            --error \
            --metrics=off \
            .

      # Upload findings to GitHub Code Scanning (Security tab + PR review surface)
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        if: always()
        with:
          sarif_file: opengrep.sarif
          category: opengrep
