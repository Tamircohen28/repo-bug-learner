[project]
name = "repo-bug-learner"
version = "0.1.0"
description = "Mine historical bug-fix commits → synthesize Scalafix/Opengrep rules → validate → ship"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.52.0",
    "pydriller>=2.6",
    "jira>=3.8.0",
    "PyGithub>=2.4.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "hdbscan>=0.8.40",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "tomli>=2.0.0",
    "click>=8.1.0",
    "rich>=13.8.0",
    "pyyaml>=6.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
rbl = "src.orchestrator:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
